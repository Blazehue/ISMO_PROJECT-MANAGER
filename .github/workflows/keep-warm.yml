name: Keep API warm

# Render's free tier puts the API to sleep after about 15 minutes without
# traffic, and waking it takes up to a minute. Pinging the health check keeps it
# awake, so reviewers on the web app or the APK don't hit a cold start.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health check
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 https://ismo-api-j4b7.onrender.com/api/health
