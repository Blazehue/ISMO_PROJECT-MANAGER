# Local stack: PostgreSQL + the API.
#   docker compose up --build
# API: http://localhost:4000/api
# Seed demo data from the host:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ismo pnpm --filter @ismo/api db:seed
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ismo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ismo']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ismo
      JWT_ACCESS_SECRET: local-docker-secret-change-me-at-least-32-chars
      CORS_ORIGINS: http://localhost:5173
      TRUST_PROXY: 0
    ports:
      - '4000:4000'

volumes:
  pgdata:
